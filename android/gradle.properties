org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Build performance optimizations
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

# Kotlin optimizations
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.caching.enabled=true

# Android optimizations - Focus on performance, not size
android.enableR8.fullMode=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Additional performance optimizations
# Disable resource optimization to keep all resources available
android.enableResourceOptimizations=false

# Enable dex optimization for better runtime performance
android.enableDexingArtifactTransform=true
