name: pantory
description: A freemium subscription-based pantry management app with 7-day trial and Razorpay integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Authentication
  supabase_flutter: ^2.3.4
  
  # Payment Integration
  razorpay_flutter: ^1.3.6
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  
  # HTTP & API
  http: ^1.1.2
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  
  # QR Code
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - Pantory.png
  
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
