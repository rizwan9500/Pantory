name: pantory
description: A freemium subscription-based pantry management app with 7-day trial and Razorpay integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Authentication
  supabase_flutter: ^2.3.4
  
  # Payment Integration
  razorpay_flutter: ^1.3.6
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  
  # HTTP & API
  http: ^1.1.2
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # AI & ML Features
  google_ml_kit: ^0.16.3
  image_picker: ^1.0.7
  image: ^4.1.7
  tflite_flutter: ^0.10.4
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.5
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  
  # Barcode & OCR
  mobile_scanner: ^3.5.6
  
  # AI APIs (for advanced features)
  google_generative_ai: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - Pantory.png
  
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
